[project]
name = "conversor-slide"
version = "0.1.0"
description = "Converte os slides em PDF de MATA53 (Teoria dos Grafos) para Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "pymupdf>=2.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
